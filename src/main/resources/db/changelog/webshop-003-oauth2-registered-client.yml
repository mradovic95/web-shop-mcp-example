databaseChangeLog:

  - changeSet:
      id: webshop-003-oauth2-registered-client
      author: web-shop
      changes:
        - createTable:
            tableName: oauth2_registered_client
            columns:
              - column:
                  name: id
                  type: varchar(100)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: client_id
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: client_id_issued_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: client_secret
                  type: varchar(200)
              - column:
                  name: client_secret_expires_at
                  type: timestamptz
              - column:
                  name: client_name
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: client_authentication_methods
                  type: varchar(1000)
                  constraints:
                    nullable: false
              - column:
                  name: authorization_grant_types
                  type: varchar(1000)
                  constraints:
                    nullable: false
              - column:
                  name: redirect_uris
                  type: varchar(1000)
              - column:
                  name: post_logout_redirect_uris
                  type: varchar(1000)
              - column:
                  name: scopes
                  type: varchar(1000)
                  constraints:
                    nullable: false
              - column:
                  name: client_settings
                  type: varchar(2000)
                  constraints:
                    nullable: false
              - column:
                  name: token_settings
                  type: varchar(2000)
                  constraints:
                    nullable: false
