spring:
  application:
    name: web-shop-mcp-example
  data:
    web:
      pageable:
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-webshop-master.xml
    enabled: true
  ai:
    mcp:
      server:
        name: web-shop-mcp
        version: 1.0.0
        type: sync
        protocol: streamable
        instructions: >
          Web shop product catalog. Use these tools to list, look up, create,
          update and delete products. Prices are in EUR.
        streamable-http:
          mcp-endpoint: /mcp

webshop:
  oauth2:
    issuer: http://localhost:8080
    # RSA signing key, generated on first start; keeps tokens valid across restarts
    jwk-file: .data/oauth2-jwk.json
